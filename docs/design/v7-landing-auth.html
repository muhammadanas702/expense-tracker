forgot:()=>AU(`<div class="big">${ic('key')}</div><h2 class="c2">Forgot password?</h2><p class="s3 c2">Enter your email and we will send you a 6-digit code to reset it.</p>${fld('EMAIL','mail','you@example.com','anas@example.com')}${B('Send code','otp')}${bl('login','Back to login')}`),
otp:()=>AU(`<div class="big">${ic('mail')}</div><h2 class="c2">Check your email</h2><p class="s3 c2">We sent a 6-digit code to <b>an•••@example.com</b></p><div class="otp"><i>4</i><i>2</i><i>7</i><i class="a">1</i><i></i><i></i></div>${B('Verify code','reset')}<div class="ft2">Resend code in <b>00:42</b> · <a class="lnk">Change email</a></div>${bl('forgot','Back')}`),
reset:()=>AU(`<h2>Create new password</h2><p class="s3">Choose a strong password you have not used before.</p>${fld('NEW PASSWORD','lock','Min. 8 characters','••••••••••',1)}${meter(4)}<div style="margin:14px 0 16px">${ck('At least 8 characters')}${ck('Contains a number')}${ck('Contains a symbol')}</div>${fld('CONFIRM PASSWORD','lock','Repeat password','••••••••••',1)}${B('Reset password','done')}`),
done:()=>AU(`<div class="big ok">${ic('ck')}</div><h2 class="c2">Password updated</h2><p class="s3 c2">Your password was changed successfully. You can now log in with your new password.</p>${B('Back to login','login')}`),
setup:()=>CT(`<div class="stp"><i class="d">${ic('ck')}</i>Account<s></s><i class="c">2</i>Setup<s></s><i>3</i>Done</div><h2 class="c2">Let's set up your account</h2><p class="s3 c2">You can change all of this later in Settings.</p><div class="GE"><div class="fl"><label>BASE CURRENCY</label><select class="inp" style="height:48px"><option>PKR – Rs</option></select></div><div class="fl"><label>MONTHLY INCOME</label><input class="inp" style="height:48px" value="Rs 60,000"></div></div><div class="fl"><label>SAVINGS GOAL · 28% OF INCOME</label><div class="bar" style="height:10px"><i style="width:28%"></i></div></div><div class="fl"><label>START WITH</label><div class="pk"><div class="on">${ic('wal')}Personal</div><div>${ic('users')}Shared</div><div>${ic('grid')}Both</div></div></div>${B('Continue to dashboard','!Opens the dashboard')}<div class="ft2"><a class="lnk">Skip for now</a></div>`),
invite:()=>CT(`<div class="c2"><div class="gi" style="margin:0 auto 12px;width:60px;height:60px">${ic('mtn','#0f766e')}</div><div class="k">Ali invited you to join</div><h2 style="margin:4px 0 10px">Murree Trip</h2><div style="margin-bottom:6px">${stk(['A','S','U','Z','M'])}</div><p class="s3" style="margin-top:10px">5 members · Rs 48,500 spent</p></div>${B('Create account to join','register')}<div class="ft2">Already have an account? <a class="lnk" onclick="go('login')">Log in</a></div>`),
offline:()=>CT(`<div class="c2"><div class="big wr">${ic('wo')}</div><h2>You are offline</h2><p class="s3">Your saved data is safe. Changes will sync when you are back online.</p></div><div class="g card" style="padding:6px 14px;margin-bottom:18px">${R('home','Dashboard','Available offline','',  '', '#0f766e')}${R('exp','Add expense','Saved on this device','','','#ea580c')}</div>${B('Try again','!Checking connection...')}`),
del:()=>`<div class="ctr2 dim"><div class="g fc"><div class="big wr">${ic('warn')}</div><h2 class="c2">Delete account permanently?</h2><p class="s3 c2">This cannot be undone. The following will be erased:</p><div style="margin-bottom:16px">${ck('All income and expense records')}${ck('Your groups and shared balances')}${ck('Your profile and settings')}</div><div class="fl"><label>TYPE DELETE TO CONFIRM</label><input class="inp" style="height:48px" placeholder="DELETE"></div><div class="GE"><span class="btn lg o" style="width:100%">Cancel</span><span class="btn lg e2" style="width:100%;opacity:.6">Delete</span></div></div></div>`};
const SEL=[['Public site',[['land','Landing page']]],['Authentication',[['login','Login'],['register','Register'],['forgot','Forgot password'],['otp','Check email / code'],['reset','New password'],['done','Success']]],['After sign-up',[['setup','Account setup'],['invite','Group invite link']]],['Other',[['offline','Offline page'],['del','Delete account']]]];
function toast(el,t){const f=el.closest('.win,.dev'),d=document.createElement('div');d.className='tst';d.textContent=t;f.appendChild(d);setTimeout(()=>d.remove(),2200)}
function go(v){const D=$('D'),P=$('P');MB=false;D.innerHTML=E(V[v]());MB=true;P.innerHTML=`<div class="ps">${E(V[v]())}</div>`;MB=false;D.scrollTop=0;
$('sel').innerHTML=SEL.map(g=>`<div class="sg"><b>${g[0]}</b>${g[1].map(x=>`<a class="${x[0]==v?'on':''}" onclick="go('${x[0]}')">${x[1]}</a>`).join('')}</div>`).join('')}
go('land');
</script></body></html>
