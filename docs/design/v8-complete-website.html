case 'mgroup':M(`<h2 style="margin-bottom:16px">New group</h2><div class="fl"><label>GROUP NAME</label><input id="g_n" class="inp" placeholder="e.g. Weekend Trip"></div><div class="fl"><label>MEMBERS (comma separated)</label><input id="g_m" class="inp" placeholder="Ali, Sara"></div><div class="GE"><span class="btn o w" onclick="A('cm')">Cancel</span><span class="btn w" onclick="A('group')">Create</span></div>`);break;
case 'group':{const n=g('g_n'),m=g('g_m').split(',').map(x=>x.trim()).filter(Boolean);if(!n||!m.length)return T('Add a name and at least one member','warn');S.groups.push({id:Date.now(),n,ic:'users',m:['You',...m],e:[],s:[]});S.log.unshift('You created '+n);A('cm');T('Group created');render();break}
case 'mexp':{const gp=S.groups.find(q=>q.id==S.gid);M(`<h2 style="margin-bottom:16px">Add shared expense</h2><div class="fl"><label>DESCRIPTION</label><input id="e_d" class="inp" placeholder="Dinner"></div><div class="GE" style="gap:12px"><div class="fl"><label>AMOUNT</label><input id="e_a" type="number" class="inp" placeholder="0"></div><div class="fl"><label>PAID BY</label><select id="e_p" class="inp">${gp.m.map(x=>`<option>${x}</option>`).join('')}</select></div></div><p class="k" style="margin-bottom:16px">Split equally between ${gp.m.length} people</p><div class="GE"><span class="btn o w" onclick="A('cm')">Cancel</span><span class="btn w" onclick="A('sexp')">Save</span></div>`);break}
case 'sexp':{const gp=S.groups.find(q=>q.id==S.gid),a=+g('e_a'),d=g('e_d');if(!d||!(a>0))return T('Enter a description and amount','warn');gp.e.push({d,a,p:g('e_p')});S.log.unshift(g('e_p')+' added “'+d+'”');A('cm');T('Expense added');render();break}
case 'settle':{const[id,f,t,a]=x.split('|'),gp=S.groups.find(q=>q.id==id);gp.s.push({f,t,a:+a});S.log.unshift(f+' paid '+t+' '+m$(+a));T('Payment recorded');render();break}
case 'q':S.adm.q=x;render();{const i=$('sq');i.focus();i.setSelectionRange(99,99)}break;
case 'block':{const u=S.users.find(u=>u.e==x);u.b=u.b?0:1;T(u.n+(u.b?' blocked':' unblocked'),'ban');render();break}
case 'mdu':M(mh('warn','Delete this user?','Their data will be permanently removed.',`<div class="GE"><span class="btn o w" onclick="A('cm')">Cancel</span><span class="btn r w" onclick="A('du','${x}')">Delete</span></div>`));break;
case 'du':S.users=S.users.filter(u=>u.e!=x);A('cm');T('User deleted','tr');render();break;
case 'sys':S.adm[x]=S.adm[x]?0:1;T('Setting updated');render();break}}
$('pv').innerHTML=`<a class="btn sm" style="box-shadow:none" id="bp" onclick="PV(0)">${ic('pc')} PC</a><a class="btn sm" style="box-shadow:none;background:transparent" id="bm" onclick="PV(1)">${ic('phone')} Phone</a>`;
function PV(p){document.body.classList.toggle('ph',!!p);$('bp').style.background=p?'transparent':'';$('bm').style.background=p?'':'transparent';$('bm').style.backgroundImage=p?'':'none'}
render();
</script></body></html>
