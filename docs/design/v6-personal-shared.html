grp:()=>`<div class="G4">${[['🏔️','Murree Trip',['A','S','U','Z','M'],'+ Rs 4,200','in'],['🏠','House Rent',['A','H','M','S'],'− Rs 2,500','ex'],['🎂','Birthday Party',['S','U','M'],'Settled ✓',''],['💖','Family',['M','F','A'],'+ Rs 900','in']].map(g=>`<div class="g gc" onclick="go('gdet')"><div class="gi">${g[0]}</div><b style="font-size:1rem">${g[1]}</b><div style="margin:8px 0">${stk(g[2])}</div><div class="${g[4]}" style="font-weight:700">${g[3]}</div></div>`).join('')}<div class="g gc" style="display:grid;place-content:center;text-align:center;border:2px dashed var(--a1);background:rgba(255,255,255,.3)"><div class="gi" style="margin:0 auto 8px;color:var(--a1)">＋</div><b style="color:var(--a1)">Create new group</b></div></div>`,
gdet:()=>K('',`<div class="gh"><div class="gi" style="margin:0">🏔️</div><div style="flex:1"><b style="font-size:1.1rem">Murree Trip</b><div style="margin-top:6px">${stk(['A','S','U','Z','M'])}</div></div><div style="text-align:right"><div class="k">Total spent</div><div class="v" style="margin:0">Rs 48,500</div></div></div><div class="ghb"><span class="btn" onclick="go('sadd')">＋ Add expense</span><span class="btn o" onclick="go('settle')">Settle up</span></div>`,'hero')+`<div class="G2">`+K(`Expenses ${tabs(['Expenses','Balances','Members'])}`,R('🍽️','Dinner at Kohsar','Ali paid Rs 6,000 · 5 people','you owe 1,200','ex')+R('⛽','Petrol','You paid Rs 8,000','you lent 6,400','in')+R('🏨','Hotel – 2 nights','Sara paid Rs 22,000','you owe 4,400','ex')+R('🎟️','Chairlift tickets','Usman paid Rs 4,500','you owe 900','ex'))+`<div style="display:flex;flex-direction:column;gap:14px">`+K('Who pays whom',RA('You → Ali',0,'simplified','Rs 1,200','ex')+RA('Sara → You',1,'simplified','Rs 3,400','in')+RA('Usman → Ali',2,'simplified','Rs 800','')+`<div class="k" style="margin-top:8px">✨ Simplify debts is ON: fewer payments</div>`)+K('Spent by member',[['Ali',34,0],['Sara',28,1],['You',20,2],['Usman',18,3]].map(x=>`<div style="margin-bottom:10px;font-size:.82rem;display:flex;justify-content:space-between"><span>${x[0]}</span><b>${x[1]}%</b></div><div class="bar" style="margin:-6px 0 10px"><i style="width:${x[1]*2.5}%;background:${C[x[2]]}"></i></div>`).join(''))+`</div></div>`,
sadd:()=>`<div class="G2">`+K('',`<div class="fl"><label>GROUP</label><div class="chips"><span class="chip on">🏔️ Murree Trip</span><span class="chip">🏠 House Rent</span><span class="chip">🎂 Birthday</span></div></div><div class="fl"><label>DESCRIPTION</label><input class="inp" value="Dinner at Kohsar"></div><div class="GE"><div class="fl"><label>TOTAL AMOUNT</label><input class="inp" value="Rs 6,000" style="font-weight:800"></div><div class="fl"><label>PAID BY</label><select class="inp"><option>Ali</option><option>You</option></select></div></div><div class="fl"><label>SPLIT</label><div class="chips"><span class="chip on">= Equally</span><span class="chip">Exact amounts</span><span class="chip">Percent</span><span class="chip">Shares</span></div></div><div class="row"><span>📸 Attach receipt<small>Optional</small></span><b style="color:var(--a1)">Upload</b></div><div class="row"><span>👛 Add my share to Personal expenses<small>Auto-records Rs 1,200 as Food</small></span><b><i class="sw"></i></b></div><button class="btn" style="width:100%;margin-top:10px;padding:14px">Save shared expense</button>`)+K('Who is in this split?',[['Ali','paid'],['You',''],['Sara',''],['Usman',''],['Zain','']].map((m,i)=>RA(m[0],i,m[1]||'participant','Rs 1,200','','&nbsp;✅')).join('')+`<div class="k" style="margin-top:8px">5 people × Rs 1,200 = Rs 6,000</div>`)+`</div>`,
fr:()=>`<div class="G2">`+K('Your friends',RA('Ali',0,'Murree Trip, House Rent','you owe Rs 1,200','ex')+RA('Sara',1,'Murree Trip','owes you Rs 3,400','in')+RA('Usman',2,'Murree Trip, Birthday','owes you Rs 4,800','in')+RA('Zain',3,'Murree Trip','settled ✓','')+RA('Hamza',4,'House Rent','settled ✓',''))+K('Invite a friend',`<div class="fl"><label>NAME OR PHONE</label><input class="inp" placeholder="03xx-xxxxxxx"></div><span class="btn i2" style="width:100%;margin-bottom:10px">💬 Invite on WhatsApp</span><span class="btn o" style="width:100%">🔗 Copy invite link</span>`)+`</div>`,
act:()=>K('Today',R('🍽️','Ali added “Dinner at Kohsar”','Murree Trip · 2h ago','you owe 1,200','ex')+R('💬','Sara commented “I will pay tonight”','Murree Trip · 5h ago',''))+K('Yesterday',R('💸','Sara paid you via Easypaisa','Murree Trip','+ 1,000','in')+R('🏠','Hamza added “Electricity bill”','House Rent','you owe 2,500','ex')+R('👥','Zain joined the group','Murree Trip','')),
settle:()=>`<div class="G2">`+K('',`<div class="fl"><label>PAYING TO</label><div class="chips"><span class="chip on">Ali</span><span class="chip">Hamza</span></div></div><div class="fl"><label>AMOUNT</label><input class="inp amt" value="Rs 1,200" style="--t:var(--a1)"></div><div class="fl"><label>PAYMENT METHOD</label><div class="chips"><span class="chip on">Cash</span><span class="chip">Easypaisa</span><span class="chip">JazzCash</span><span class="chip">Bank</span></div></div><div class="fl"><label>NOTE</label><input class="inp" placeholder="Optional"></div><button class="btn i2" style="width:100%;padding:14px">Record payment</button>`)+K('Summary',`<div class="v" style="font-size:1.3rem">You → Ali</div><div class="k" style="line-height:1.6">After this payment you and Ali will be <b class="in">all settled ✅</b> in Murree Trip.</div>`)+`</div>`};
const SEL={p:[['dash','Dashboard'],['inc','Add Income'],['exp','Add Expense'],['rep','Full Report'],['pro','Profile']],s:[['shome','Overview'],['grp','Groups'],['gdet','Group Detail'],['sadd','Add Shared'],['fr','Friends'],['act','Activity'],['settle','Settle Up']]};
const nots=R('🍽️','Ali added “Dinner at Kohsar”','Murree Trip','2h')+R('💸','Sara paid you Rs 1,000','Easypaisa','1d')+R('⚡','Electricity bill due','Rs 4,200','3d left','ex');
const tbar=(v,m)=>`<div class="g tb"><div class="tt"><h2>${TT[v][0]}</h2><small>${TT[v][1]}</small></div><div class="seg"><a class="${m=='p'?'on':''}" onclick="go('dash')">👛 Personal</a><a class="${m=='s'?'on':''}" onclick="go('shome')">🤝 Shared</a></div><div class="ic bl" onclick="this.closest('.tb').querySelector('.np').classList.toggle('open')">🔔<i class="dt"></i></div><div class="me" onclick="go('pro')"><i class="av" style="background:linear-gradient(135deg,#F59E0B,#f97316)">MA</i><span>Muhammad Anas<small>Admin</small></span></div><div class="g np"><div class="t">Notifications<a>Mark all read</a></div>${nots}</div></div>`;
function go(v){MB=false;const m=MODE[v]||'s',a=ACT[v]||v,n=NAV[m],D=$('D'),P=$('P'),bt=n.filter(x=>x[0]!='sadd');
D.dataset.mode=P.dataset.mode=m;
D.innerHTML=E(`<div class="ap"><aside class="g sb"><div class="logo"><span class="lgo">YOUR<br>LOGO</span><span class="wm">ExpenseFlow</span></div><div class="sl">${m=='p'?'Personal':'Shared'}</div>${n.map(x=>`<a class="nv ${x[0]==a?'on':''}" onclick="go('${x[0]}')">${ic(x[1])}${x[2]}</a>`).join('')}<div class="sp"></div><div class="nv">${ic('out')}Logout</div></aside><div class="mn">${tbar(v,m)}<div class="view">${V[v]()}</div></div></div>`);
MB=true;const body=tbar(v,m)+`<div class="view">${V[v]()}</div>`;MB=false;
P.innerHTML=E(`<div class="ap"><div class="mn">${body}</div></div>${m=='s'?`<a class="fabf" onclick="go('sadd')">${ic('pl')}</a>`:''}<nav class="g bn">${bt.map(x=>`<a class="${x[0]==a?'on':''}" onclick="go('${x[0]}')">${ic(x[1])}${x[2].replace('Add ','').replace('Full ','')}</a>`).join('')}</nav>`);
$('P').querySelector('.ap').scrollTop=0;
$('sel').innerHTML=['p','s'].map(k=>`<div class="sg"><b>${k=='p'?'Personal':'Shared'}</b>${SEL[k].map(x=>`<a class="${x[0]==v?'on':''}" onclick="go('${x[0]}')">${x[1]}</a>`).join('')}</div>`).join('')}
go('dash');
</script>
