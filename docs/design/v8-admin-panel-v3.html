.sb{align-self:start;top:16px;max-height:calc(100vh - 32px)}

@container (max-width:880px){
.t{gap:6px 10px}.t .k{font-size:.7rem}

.top{border-radius:18px}.card{border-radius:18px}
.G4{grid-template-columns:1fr 1fr}.G4>*:only-child{grid-column:1/-1}
.row{gap:10px}.cat{width:36px;height:36px}

}

@container (max-width:880px){
.top h2{order:1;flex:1;min-width:0}.top .bw{order:2}.top .acc{order:3}.top .top2{order:4;width:100%}.top .vs{flex:1}.top .vs a{flex:1;text-align:center;padding:8px 6px}.top2 span{display:inline!important;white-space:nowrap}

.sw2{gap:8px}
}

@container (max-width:880px){.G4 .v,.G3 .v{font-size:clamp(.95rem,5.2cqw,1.35rem)}.hero .v{font-size:clamp(1.5rem,8cqw,1.9rem)}}

.bn{background:rgba(255,255,255,.9)!important;backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);box-shadow:0 8px 28px rgba(11,37,69,.18)}

case 'csv':{const b=new Blob(['name,email,role,joined,status\n'+S.users.map(u=>[u.n,u.e,u.r,u.j,u.b?'blocked':'active'].join(',')).join('\n')],{type:'text/csv'}),l=document.createElement('a');l.href=URL.createObjectURL(b);l.download='users.csv';l.click();T('Users exported','dl');break}
case 'perm':if(!can('SA'))return no();S.perm[x]=S.perm[x]?0:1;L('sys','changed Admin permission: '+x);T('Permission updated');render();break;
case 'tk':{const t=S.tk.find(q=>q.id==x);M(`<div class="k">${S.users[t.u].n} · ${t.d}</div><h2 style="margin:4px 0 10px">${t.s}</h2><div class="pv2" style="margin-bottom:14px">${ic('msg')}<span>${t.m}</span></div>${t.st=='open'?`<div class="fl"><label>YOUR REPLY</label><textarea id="rp" class="inp" placeholder="Write a reply…"></textarea></div><div class="GE"><span class="btn o w" onclick="A('cm')">Close</span><span class="btn w" onclick="A('rtk',${x})">Reply & resolve</span></div>`:`<div class="GE"><span class="btn o w" onclick="A('cm')">Close</span><span class="btn w" onclick="A('otk',${x})">Reopen</span></div>`}`);break}
case 'rtk':{if(!G('support'))break;if(g('rp').length<2)return T('Write a reply first','warn');const t=S.tk.find(q=>q.id==x);t.st='resolved';L('support','resolved ticket #'+x);A('cm');T('Reply sent, ticket resolved','mail');render();break}
case 'otk':{if(!G('support'))break;S.tk.find(q=>q.id==x).st='open';A('cm');T('Ticket reopened');render();break}
case 'send':{if(!G('bc'))break;const t=g('at'),m=g('am');if(t.length<3||m.length<5)return T('Add a title and a message','warn');S.an.unshift({t,m,a:$('aa').value,d:'Just now'});S.notes.unshift(['send',t,'Just now']);S.unread++;L('sys','sent announcement “'+t+'”');T('Announcement sent','send');render();break}
case 'dan':S.an.splice(x,1);T('Removed from history','tr');render();break;
case 'ctog':if(!G('cat'))break;S.cats[x].on=S.cats[x].on?0:1;T('Category updated');render();break;
case 'dcat':if(!G('cat'))break;S.cats.splice(x,1);S.cats.forEach((c,i)=>c.id=i);T('Category deleted','tr');render();break;
case 'mcat':if(!G('cat'))break;M(`<h2 style="margin-bottom:16px">New ${x=='e'?'expense':'income'} category</h2><div class="fl"><label>NAME</label><input id="cn" class="inp" data-t="${x}" placeholder="e.g. Groceries"></div><div class="GE"><span class="btn o w" onclick="A('cm')">Cancel</span><span class="btn w" onclick="A('acat')">Add</span></div>`);break;
case 'acat':{const n=g('cn');if(n.length<2)return T('Enter a name','warn');S.cats.push({id:S.cats.length,n,t:$('cn').dataset.t,on:1});L('sys','added category '+n);A('cm');T('Category added');render();break}

case 'rt':if(!G('cur'))break;$('rtb').classList.add('spin');$('rtb').innerHTML=ic('ref')+' Updating…';setTimeout(()=>{S.cu.forEach(c=>{if(c.c!='PKR')c.r=+(c.r*(1+(Math.random()-.5)*.02)).toFixed(4)});S.rates='11 Oct 2026, '+new Date().toTimeString().slice(0,5);L('sys','updated exchange rates');T('Exchange rates updated','ref');render()},1400);break;
case 'mdg':M(mh('Delete group “'+S.gr[x].n+'”?','The group and its shared expenses will be removed for all members.',cf(`A('dg',${x})`,'Delete')));break;
case 'dg':{if(!G('view'))break;const n=S.gr[x].n;S.gr.splice(x,1);S.gr.forEach((q,i)=>q.id=i);L('sys','deleted group '+n);A('cm');T('Group deleted','tr');render();break}
case 'al':S.al=x;render();break;
case 'clog':if(!can('SA'))return no();S.lg=[];T('Audit log cleared','tr');render();break;
case 'sys':{const sa=['tfa','lock'];if(sa.includes(x)&&!can('SA'))return no();if(!sa.includes(x)&&!G(x=='auto'?'backup':'set'))break;S.set[x]=S.set[x]?0:1;L('sys','changed setting: '+x);T('Setting updated');render();break}
case 'rev':if(!can('SA'))return no();S.ss.splice(x,1);T('Session revoked','out');render();break;
case 'bip':if(!can('SA'))return no();S.ips.push(x);S.fl=S.fl.filter(f=>f.ip!=x);L('sys','blocked IP '+x);T('IP blocked','ban');render();break;
case 'uip':if(!can('SA'))return no();S.ips=S.ips.filter(i=>i!=x);T('IP unblocked');render();break;
case 'bkp':if(!G('backup'))break;$('bkb').classList.add('spin');$('bkb').innerHTML=ic('ref')+' Backing up…';setTimeout(()=>{S.bk.unshift({n:'backup_2026-10-11_'+new Date().toTimeString().slice(0,5).replace(':','-')+'.sql',s:'4.3 MB',d:'Just now'});L('sys','created a database backup');T('Backup created','db');render()},1400);break;
case 'mrest':if(!G('backup'))break;M(mh('Restore this backup?','Current data will be replaced by '+S.bk[x].n+'.',cf(`A('rest',${x})`,'Restore')));break;
case 'rest':L('sys','restored '+S.bk[x].n);A('cm');T('Backup restored','db');render();break;
case 'dbk':if(!G('backup'))break;S.bk.splice(x,1);T('Backup deleted','tr');render();break;
case 'mpurge':{if(!G('del'))break;const n=S.users.filter(u=>u.b).length;if(!n)return T('No blocked users','warn');M(mh('Remove '+n+' blocked user(s)?','Their accounts will be deleted.',cf("A('purge')",'Remove')));break}
case 'purge':{const mp={};let k=0;S.users.forEach((u,i)=>{if(!u.b)mp[i]=k++});S.tk=S.tk.filter(t=>mp[t.u]!==undefined).map(t=>({...t,u:mp[t.u]}));S.rq=S.rq.filter(t=>mp[t.u]!==undefined).map(t=>({...t,u:mp[t.u]}));S.users=S.users.filter(u=>!u.b);S.users.forEach((u,i)=>u.id=i);L('sys','removed blocked users');A('cm');T('Blocked users removed','tr');render();break}
case 'us':S.us=x;$('ut').innerHTML=utbl();break;
case 'gs':{const q=x.toLowerCase(),r=$('gsr');if(!q){r.classList.remove('o');break}const l=S.users.filter(u=>(u.n+u.e).toLowerCase().includes(q)).slice(0,5);r.innerHTML=l.map(u=>`<div class="row" style="cursor:pointer" onclick="A('prof',${u.id})"><div class="us">${av(u.n,30)}<div><b>${u.n}</b><div class="k">${u.e}</div></div></div></div>`).join('')||'<p class="k">No users found</p>';r.classList.add('o');break}
case 'acc':{const nm=S.me=='Super Admin'?'Muhammad Anas':'Ali Raza';M(`<div style="display:flex;gap:14px;align-items:center;margin-bottom:18px">${av(nm,56)}<div><b style="font-size:1.1rem">${nm}</b><div style="margin-top:6px">${rt(S.me)}</div></div></div><div class="fl"><label>NEW PASSWORD</label><input id="np" class="inp" type="password" placeholder="Min. 8 characters"></div><div class="row"><span class="m">Two-factor authentication<small>Extra login step</small></span>${sw(1,"this.classList.toggle('on')")}</div><div class="GE" style="margin-top:16px"><span class="btn o w" onclick="A('cm')">Close</span><span class="btn w" onclick="A('pw')">Save</span></div>`);break}
case 'pw':{const p=g('np');if(p&&p.length<8)return T('Password must be at least 8 characters','warn');A('cm');T('Account updated');break}
case 'inv':{if(!can('SA'))return no();const e=g('ie');if(!/^\S+@\S+\.\S+$/.test(e))return T('Enter a valid email','warn');S.inv.unshift({e,r:$('ir').value,w:'Just now'});L('user','invited '+e+' as '+$('ir').value);T('Invite sent to '+e,'mail');render();break}
case 'rinv':if(!can('SA'))return no();S.inv.splice(x,1);T('Invite revoked');render();break;
case 'rqok':{if(!G('del'))break;const i=S.rq[x].u;S.rq.splice(x,1);A('du',i);break}
case 'rqno':if(!G('del'))break;L('user','rejected a deletion request');S.rq.splice(x,1);T('Request rejected');render();break;
case 'cm':$('m').innerHTML='';break}}
$('pv').innerHTML=`<a class="btn sm" style="box-shadow:none" id="bp" onclick="PV(0)">${ic('pc')} PC</a><a class="btn sm" style="box-shadow:none;background:transparent" id="bm" onclick="PV(1)">${ic('phone')} Phone</a>`;
document.addEventListener&&document.addEventListener('keydown',e=>{if(e.key=='Escape')A('cm')});

render();</script></body></html>
