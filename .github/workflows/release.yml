name: Build apps & publish release

# Run by pushing a tag like v1.0.0, or by hand from the Actions tab ("Run workflow").
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. 1.0.0'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Work out the version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then V="${GITHUB_REF_NAME#v}"; else V="${{ github.event.inputs.version }}"; fi
          echo "name=$V" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Accept Android SDK licenses (SDK is preinstalled on the runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Build signed APK
        working-directory: apps/android
        run: |
          set +e
          gradle --no-daemon --console=plain --stacktrace assembleRelease -PvName=${{ steps.v.outputs.name }} -PvCode=${{ github.run_number }} > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            # Put the reason in the run's annotations so it can be read without opening the log.
            MSG=$(grep -n -m1 -A25 -E "What went wrong|FAILURE|error:" build.log | head -c 3500 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Gradle build failed::$MSG"
          fi
          exit $code
      - name: Name the file
        run: cp apps/android/app/build/outputs/apk/release/app-release.apk ExpenseFlow.apk
      - uses: actions/upload-artifact@v4
        with: { name: ExpenseFlow-apk, path: ExpenseFlow.apk }
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.v.outputs.name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" ExpenseFlow.apk --clobber
          else
            gh release create "$TAG" ExpenseFlow.apk --title "ExpenseFlow $TAG" --notes "Android app (APK). Download ExpenseFlow.apk on your phone, open it and allow 'Install unknown apps' when asked. The app opens https://expenseflow.rf.gd/."
          fi

  windows:
    needs: android
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Work out the version
        id: v
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then V="${GITHUB_REF_NAME#v}"; else V="${{ github.event.inputs.version }}"; fi
          echo "name=$V" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Build Windows installer
        working-directory: apps/desktop
        shell: bash
        run: |
          npm install --no-audit --no-fund
          npx electron-builder --win nsis --publish never -c.extraMetadata.version=${{ steps.v.outputs.name }}
      - uses: actions/upload-artifact@v4
        with: { name: ExpenseFlow-exe, path: apps/desktop/dist/ExpenseFlow-Setup.exe }
      - name: Add the installer to the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v${{ steps.v.outputs.name }}" apps/desktop/dist/ExpenseFlow-Setup.exe --clobber
