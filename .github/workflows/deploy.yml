name: Deploy ExpenseFlow to InfinityFree

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: expenseflow-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out ExpenseFlow
        uses: actions/checkout@v6

      - name: Create private production configuration
        env:
          EXPENSEFLOW_DB_HOST: ${{ secrets.EXPENSEFLOW_DB_HOST }}
          EXPENSEFLOW_DB_NAME: ${{ secrets.EXPENSEFLOW_DB_NAME }}
          EXPENSEFLOW_DB_USERNAME: ${{ secrets.EXPENSEFLOW_DB_USERNAME }}
          EXPENSEFLOW_DB_PASSWORD: ${{ secrets.EXPENSEFLOW_DB_PASSWORD }}
          EXPENSEFLOW_SMTP_USERNAME: ${{ secrets.EXPENSEFLOW_SMTP_USERNAME }}
          EXPENSEFLOW_SMTP_PASSWORD: ${{ secrets.EXPENSEFLOW_SMTP_PASSWORD }}
          EXPENSEFLOW_MAIL_FROM: ${{ secrets.EXPENSEFLOW_MAIL_FROM }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import sys

          required = [
              "EXPENSEFLOW_DB_HOST",
              "EXPENSEFLOW_DB_NAME",
              "EXPENSEFLOW_DB_USERNAME",
              "EXPENSEFLOW_DB_PASSWORD",
              "EXPENSEFLOW_SMTP_USERNAME",
              "EXPENSEFLOW_SMTP_PASSWORD",
          ]
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              print("Add these GitHub Actions secrets before deploying: " + ", ".join(missing), file=sys.stderr)
              sys.exit(1)

          port = os.environ.get("EXPENSEFLOW_SMTP_PORT", "587")
          if not port.isdigit() or not 1 <= int(port) <= 65535:
              sys.exit("EXPENSEFLOW_SMTP_PORT must be a valid TCP port number.")

          database = {
              "host": os.environ["EXPENSEFLOW_DB_HOST"],
              "dbname": os.environ["EXPENSEFLOW_DB_NAME"],
              "username": os.environ["EXPENSEFLOW_DB_USERNAME"],
              "password": os.environ["EXPENSEFLOW_DB_PASSWORD"],
          }
          mail = {
              "host": os.environ.get("EXPENSEFLOW_SMTP_HOST") or "smtp.gmail.com",
              "port": int(port),
              "username": os.environ["EXPENSEFLOW_SMTP_USERNAME"],
              "password": os.environ["EXPENSEFLOW_SMTP_PASSWORD"],
              "encryption": os.environ.get("EXPENSEFLOW_SMTP_ENCRYPTION") or "tls",
              "from_email": os.environ.get("EXPENSEFLOW_MAIL_FROM") or os.environ["EXPENSEFLOW_SMTP_USERNAME"],
              "from_name": os.environ.get("EXPENSEFLOW_MAIL_FROM_NAME") or "ExpenseFlow",
          }

          def php_quote(value):
              return "'" + str(value).replace("\\", "\\\\").replace("'", "\\'") + "'"

          def php_value(value):
              if isinstance(value, dict):
                  fields = []
                  for key, item in value.items():
                      fields.append("    " + php_quote(key) + " => " + php_value(item))
                  return "[\n" + ",\n".join(fields) + ",\n]"
              if isinstance(value, int):
                  return str(value)
              return php_quote(value)

          def write_private_config(path, data):
              php = "<?php\nreturn " + php_value(data) + ";\n"
              Path(path).write_text(php, encoding="utf-8")

          Path("config").mkdir(exist_ok=True)
          write_private_config("config/db.local.php", {"production": database})
          write_private_config("config/mail.local.php", mail)
          PY

      - name: Deploy over explicit FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: strict
          local-dir: ./
          server-dir: htdocs/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/storage/**
            **/exports/**
            **/*.sql
            **/*.sql.gz
            **/*.zip
            phpinfo.php
            fix-admin.php
            set-admin.php
            Dockerfile
            Procfile
            composer.json
            composer.lock
            .gitignore
            DEPLOYMENT.md
          timeout: 60000
