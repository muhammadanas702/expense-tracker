<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B2545">
  <link rel="icon" href="favicon.ico"><title>ExpenseFlow is offline</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: #0B2545; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px;
      background: radial-gradient(circle at 15% 10%, rgba(19,122,127,.22), transparent 45%), radial-gradient(circle at 90% 85%, rgba(77,168,218,.25), transparent 45%), #EEF4F8; }
    main { width: min(100%, 440px); text-align: center; padding: 34px 26px; border-radius: 24px;
      background: rgba(255,255,255,.72); border: 1px solid rgba(255,255,255,.9); box-shadow: 0 18px 50px rgba(11,37,69,.12); }
    .big { width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center; margin: 0 auto 18px;
      background: linear-gradient(135deg, #f59e0b, #f97316); color: #fff; }
    .big svg { width: 32px; height: 32px; }
    h1 { margin: 0 0 8px; font-size: 1.5rem; letter-spacing: -.4px; }
    p { margin: 0 0 22px; color: #5F6C7D; line-height: 1.55; }
    .small { font-size: .8rem; margin: 14px 0 0; }
    button.sec { margin-top: 10px; background: #fff; color: #0B2545; border: 1px solid rgba(11,37,69,.25); }
    button { width: 100%; border: 0; border-radius: 14px; padding: 14px; font-size: 1rem; font-weight: 700; color: #fff; cursor: pointer;
      background: linear-gradient(135deg, #0f766e, #137A7F); }
  </style>
</head>
<body>
  <main>
    <div class="big"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 8.8a15 15 0 0 1 4-2.5M22 8.8a15 15 0 0 0-8.5-3.7M5 12.9a10 10 0 0 1 5-2.7M19 12.9a10 10 0 0 0-2-1.6M8.5 16.4a5 5 0 0 1 7 0"/><path d="M12 20h.01M2 2l20 20"/></svg></div>
    <h1 id="oh">Cannot reach ExpenseFlow</h1>
    <p id="om">Checking the connection&hellip;</p>
    <button type="button" id="retry">Try again</button>
    <button type="button" id="saved" class="sec" hidden>Open my saved dashboard</button>
    <p class="small" id="auto">This page tries again by itself.</p>
  </main>
  <script>
  (function () {
    // Urdu (Nastaleeq) when the person picked it: the cookie is readable from this static page
    var ur = /(?:^|; )ef_lang=ur/.test(document.cookie), D = {
      'ExpenseFlow is offline': 'ایکسپینس فلو آف لائن ہے',
      'Cannot reach ExpenseFlow': 'ایکسپینس فلو تک رسائی نہیں',
      'Checking the connection\u2026': 'کنکشن چیک ہو رہا ہے\u2026',
      'Try again': 'دوبارہ کوشش کریں',
      'Open my saved dashboard': 'میرا محفوظ ڈیش بورڈ کھولیں',
      'This page tries again by itself.': 'یہ صفحہ خود دوبارہ کوشش کرتا ہے۔',
      'No internet connection': 'انٹرنیٹ کنکشن نہیں ہے',
      'This device is offline. Turn on Wi-Fi or mobile data. Nothing is lost; your data is safe on the server.': 'یہ ڈیوائس آف لائن ہے۔ وائی فائی یا موبائل ڈیٹا آن کریں۔ کچھ ضائع نہیں ہوا؛ آپ کا ڈیٹا سرور پر محفوظ ہے۔',
      'ExpenseFlow is not answering': 'ایکسپینس فلو جواب نہیں دے رہا',
      'Your internet looks fine, but the ExpenseFlow server is slow or down right now. This is not your fault and your data is safe. We keep trying.': 'آپ کا انٹرنیٹ ٹھیک لگتا ہے، لیکن ایکسپینس فلو کا سرور ابھی سست ہے یا بند ہے۔ یہ آپ کی غلطی نہیں اور آپ کا ڈیٹا محفوظ ہے۔ ہم کوشش کرتے رہتے ہیں۔'
    };
    window.efT = function (x) { return ur && D[x] ? D[x] : x; };
    if (ur) {
      document.documentElement.lang = 'ur'; document.documentElement.dir = 'rtl';
      var l = document.createElement('link'); l.rel = 'stylesheet'; l.href = 'assets/rtl.css'; document.head.appendChild(l);
      document.title = D['ExpenseFlow is offline'];
      ['oh', 'om', 'retry', 'saved', 'auto'].forEach(function (id) { var e = document.getElementById(id); e.textContent = efT(e.textContent.replace('\u2026', '\u2026').trim()); });
    }
  })();
  (function () {
    var oh = document.getElementById('oh'), om = document.getElementById('om'), saved = document.getElementById('saved');
    // Is it the phone's internet or ExpenseFlow's server? A tiny request to health.php (never saved) tells the two apart.
    function check() {
      if (navigator.onLine === false) {
        oh.textContent = efT('No internet connection');
        om.textContent = efT('This device is offline. Turn on Wi-Fi or mobile data. Nothing is lost; your data is safe on the server.');
        return;
      }
      var c = new AbortController(), t = setTimeout(function () { c.abort(); }, 6000);
      fetch('health.php?t=' + Date.now(), { cache: 'no-store', signal: c.signal }).then(function (r) {
        clearTimeout(t);
        if (r.ok) { location.reload(); return; }
        throw new Error('bad');
      }).catch(function () {
        clearTimeout(t);
        oh.textContent = efT('ExpenseFlow is not answering');
        om.textContent = efT('Your internet looks fine, but the ExpenseFlow server is slow or down right now. This is not your fault and your data is safe. We keep trying.');
      });
    }
    document.getElementById('retry').addEventListener('click', function () { location.reload(); });
    window.addEventListener('online', check);
    check();
    setInterval(check, 10000);
    if (window.caches) {
      caches.open('expenseflow-pages-v1').then(function (c) { return c.match(new URL('dashboard.php', location.href).href); }).then(function (hit) {
        if (hit) {
          saved.hidden = false;
          saved.addEventListener('click', function () { location.href = 'dashboard.php'; });
        }
      }).catch(function () {});
    }
  })();
  </script>
</body>
</html>
